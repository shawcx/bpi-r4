#!/usr/sbin/nft -f
# Router firewall and NAT (build config FIREWALL). The LAN side is lanbr0
# and any wlan interface; everything else counts as WAN, so the WAN's name
# (eth1, wan, sfp-wan, ...) doesn't matter. /etc/nftables/99-logrej.nft ends
# input and forward with a rate-limited log and reject.

define lan = { "lanbr0", "wlan*" }

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		iifname $lan accept comment "LAN"
		icmp type echo-request limit rate 5/second accept
		icmpv6 type echo-request limit rate 5/second accept
		icmpv6 type { nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		udp dport { 68, 546 } accept comment "DHCP client"
		tcp dport 22 limit rate 10/second accept comment "SSH from the WAN"
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state invalid drop
		tcp flags syn tcp option maxseg size set rt mtu
		ct state established,related accept
		iifname $lan accept comment "LAN to anywhere"
	}
	chain output {
		type filter hook output priority filter;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		iifname $lan oifname != $lan masquerade comment "LAN to WAN"
	}
}

include "/etc/nftables/*.nft"
