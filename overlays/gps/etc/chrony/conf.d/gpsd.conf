# GPS time from gpsd (receiver: DEVICES in /etc/default/gpsd).
# gpsd, started as root, publishes its first device's serial (NMEA/UBX) time
# in NTP shared memory segment 0. SHM rather than chrony's preferred SOCK:
# gpsd only connects to a SOCK socket while still root, so a receiver
# hotplugged after boot would never reach chronyd, while the SHM segments
# are set up when gpsd starts. No PPS: USB receivers don't pass it through.
# delay widens the error bound so serial jitter doesn't make NTP and GPS
# disagree. offset is the receiver's serial latency (GPS_OFFSET in the
# build config); 0.067 for a u-blox 7 (USB, 9600 baud), whose time arrives
# 67ms late against NTP.
refclock SHM 0 refid GPS precision 1e-1 offset 0.067 delay 0.2
